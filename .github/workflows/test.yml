name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TF_CPP_MIN_LOG_LEVEL: '3'
      PYTHONDONTWRITEBYTECODE: '1'
      MPLCONFIGDIR: /tmp/tensortrade-mpl
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra research --no-editable
      - run: uv run --frozen --no-editable ruff check src tests scripts
      - run: uv run --frozen --no-editable ruff format --check src tests scripts
      - run: uv run --frozen --no-editable python scripts/check_release.py
      - run: uv run --frozen --no-editable pytest -q
      - name: Synthetic CLI smoke test
        run: uv run --frozen --no-editable ttlab demo --rows 1200 --timesteps 256 --output runs/ci-smoke
