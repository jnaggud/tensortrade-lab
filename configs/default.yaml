market:
  symbol: BTC
  currency: USD
  bar_minutes: 60
  periods_per_year: 8760
  require_regular_bars: true
execution:
  initial_cash: 10000
  commission: 0.001
  slippage_bps: 5
  min_trade_value: 10
  rebalance_band: 0.05
risk:
  max_position: 0.75
  max_drawdown: 0.20
  stop_loss: 0.08
  take_profit: 0.20
  cooldown_bars: 4
features:
  window: 24
split:
  train_fraction: 0.60
  validation_fraction: 0.20
  purge_bars: 24
training:
  total_timesteps: 100000
  eval_every: 5000
  patience: 6
  learning_rate: 0.0003
  n_steps: 1024
  batch_size: 128
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  entropy_coefficient: 0.01
  hidden_sizes: [64, 64]
  drawdown_penalty: 0.10
  turnover_penalty: 0.0001
  seed: 42

compute:
  device: auto
  workers: 0
  threads_per_worker: 1
  vector_envs: 0
  gpu_jobs: 1
