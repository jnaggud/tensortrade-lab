name: focused-etf
assets: [SPY, QQQ]
sources:
  SPY: data/focused/SPY_1999_2015.parquet
  QQQ: data/focused/QQQ_1999_2015.parquet
holdout_start: '2014-01-01'
holdout_end: '2016-01-01'
folds:
  - {name: financial_crisis, training_end: '2006-01-01', tuning_end: '2008-01-01', scoring_end: '2010-01-01'}
  - {name: recovery_and_euro_crisis, training_end: '2008-01-01', tuning_end: '2010-01-01', scoring_end: '2012-01-01'}
  - {name: expansion, training_end: '2010-01-01', tuning_end: '2012-01-01', scoring_end: '2014-01-01'}
seeds: [17, 42, 83]
stage_budgets: [100000, 500000, 2000000]
promotion_min_gain: 0.005
promotion_fraction: 0.5
max_drawdown: 0.30
min_positive_fold_fraction: 0.6666666666666666
bootstrap_samples: 2000
bootstrap_block_bars: 20
ppo_candidates:
  - {name: ppo_own, feature_set: own, learning_rate: 0.0003, gamma: 0.995}
  - {name: ppo_cross, feature_set: cross, learning_rate: 0.0003, gamma: 0.995}
rule_candidates:
  - {name: trend_60, strategy: trend, lookback: 60}
  - {name: trend_120, strategy: trend, lookback: 120}
  - {name: volatility_trend, strategy: volatility_trend, lookback: 60}
  - {name: relative_strength, strategy: relative_strength, lookback: 60}
  - {name: tree_own, strategy: supervised, feature_set: own}
  - {name: tree_cross, strategy: supervised, feature_set: cross}
config:
  market: {calendar: XNYS, bar_minutes: 1440, periods_per_year: 252, price_adjustment: split_adjusted}
  features: {window: 5, reference_minutes: 1440}
  execution: {commission: 0.0005, slippage_bps: 5, rebalance_band: 0.05}
  risk: {max_position: 1.0, max_drawdown: 1.0, stop_loss: 1.0, take_profit: 100.0, cooldown_bars: 0, direction: long_only}
  split: {purge_bars: 5}
  training:
    total_timesteps: 100000
    n_steps: 1024
    batch_size: 256
    n_epochs: 5
    eval_every: 10000
    patience: 10000
    hidden_sizes: [64, 64]
    entropy_coefficient: 0.005
    drawdown_penalty: 0.0
    turnover_penalty: 0.0
  compute: {workers: 0, device: cpu, threads_per_worker: 1, vector_envs: 1}
