[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tensortrade-lab"
version = "0.1.0"
description = "Reproducible TensorTrade research, PPO training, and paper execution"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Jefferson Duggan"}]
keywords = ["backtesting", "tensortrade", "reinforcement-learning", "quantitative-finance"]
requires-python = ">=3.12,<3.13"
dependencies = [
  "tensortrade",
  "numpy>=1.26.4,<2",
  "pandas>=2.2.3,<3",
  "stable-baselines3>=2.4,<3",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "plotly>=5,<7",
  "streamlit>=1.40,<2",
  "filelock>=3,<5",
  "optuna>=4.5,<6",
  "exchange-calendars>=4.5,<5",
  "scikit-learn>=1.5,<2",
  "psutil>=6,<8",
  "requests>=2.32,<3",
  "yfinance>=0.2.65,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]
research = ["databento>=0.70,<1", "beautifulsoup4>=4.12,<5", "scipy>=1.13,<2", "matplotlib>=3.8,<4"]
cpu = ["torch>=2.3,<3"]
cu130 = ["torch>=2.3,<3; sys_platform == 'linux' or sys_platform == 'win32'"]

[project.urls]
Repository = "https://github.com/jnaggud/tensortrade-lab"
Issues = "https://github.com/jnaggud/tensortrade-lab/issues"
Documentation = "https://github.com/jnaggud/tensortrade-lab/tree/main/docs"

[project.scripts]
ttlab = "tensortrade_lab.cli:main"

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]

[tool.uv.sources]
tensortrade = { git = "https://github.com/tensortrade-org/tensortrade.git", rev = "d58afba23deb1fded39793203b7997c3990bb032" }
torch = [
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
  { index = "pytorch-cu130", extra = "cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["external_data: reconciliation checks requiring separately supplied market data and TradingView exports"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/test_*paper151.py" = ["E402"]
"tests/test_paper151_extension.py" = ["E402"]
"tests/test_ensemble_expansion.py" = ["E402"]
"tests/test_intraday_research.py" = ["E402"]
# Preserve the hashed research implementation's equivalent local callable.
"src/tensortrade_lab/features.py" = ["E731"]

[tool.hatch.build.targets.wheel]
packages = ["src/tensortrade_lab"]
